<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danny Man Academy | Formamos campeones para la vida</title>
<style>
  body{font-family:sans-serif;margin:0;background:#FAF8F5;color:#141311;}
  section{padding:60px 24px;max-width:1100px;margin:0 auto;}
  .hero{background:#141311;color:#fff;text-align:center;padding:100px 24px;}
  .btn{display:inline-block;padding:14px 26px;border-radius:999px;background:#C8102E;color:#fff;font-weight:bold;margin-top:20px;}
  .btn-wa{background:#25D366;}
  .prog-grid, #sedes-contenedor{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:30px;}
  .prog-card, .sede-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px;}
  .prog-card img, .sede-card img{width:100%;border-radius:8px;margin-bottom:12px;object-fit:cover;height:180px;background:#ddd;}
  .prog-tag{background:#C8102E;color:#fff;font-size:.7rem;padding:4px 10px;border-radius:999px;}
</style>
</head>
<body>

  <!-- HERO: el texto NO está escrito aquí, se llena solo desde sitio.json -->
  <section class="hero">
    <h1 data-campo="hero_titulo">Cargando...</h1>
    <p data-campo="hero_subtitulo"></p>
    <a href="#" class="btn btn-wa" data-whatsapp>Escríbenos por WhatsApp</a>
  </section>

  <!-- PROGRAMAS: se llena solo desde programas.json -->
  <section>
    <h2>Nuestros programas</h2>
    <div id="programas-contenedor" class="prog-grid"></div>
  </section>

  <!-- SEDES: se llena solo desde sedes.json -->
  <section>
    <h2>Nuestras sedes</h2>
    <div id="sedes-contenedor"></div>
  </section>

  <script src="/js/cargar-contenido.js"></script>
</body>
</html>
