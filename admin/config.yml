# =====================================================
# CONFIGURACIÓN DEL PANEL DE ADMINISTRACIÓN
# Aquí defines EXACTAMENTE qué puede editar el cliente.
# =====================================================

# Usa autenticación clásica de DecapBridge (obligatorio)
backend:
  name: git-gateway
  repo: Joel211/evelin
  branch: main
  identity_url: https://auth.decapbridge.com/sites/6e4294a1-d511-48a7-9925-d0539ca5053c
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Crear {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> vía DecapBridge
    update: Actualizar {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> vía DecapBridge
    delete: Eliminar {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> vía DecapBridge
    uploadMedia: Subir “{{path}}” - {{author-name}} <{{author-login}}> vía DecapBridge
    deleteMedia: Eliminar “{{path}}” - {{author-name}} <{{author-login}}> vía DecapBridge
    openAuthoring: Mensaje {{message}} - {{author-name}} <{{author-login}}> vía DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://dannyman.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "sitio"
    label: "Textos generales del sitio"
    files:
      - file: "content/sitio.json"
        label: "Hero, diferencia y redes"
        name: "sitio"
        fields:
          - {label: "Número de WhatsApp general (formulario y botón flotante)", name: "whatsapp_general", widget: "string"}
          - {label: "Foto de portada (hero)", name: "hero_imagen", widget: "image"}
          - {label: "Título principal (hero)", name: "hero_titulo", widget: "string"}
          - {label: "Subtítulo (hero)", name: "hero_subtitulo", widget: "string"}
          - {label: "Foto de fondo 'Nuestra diferencia'", name: "diferencia_imagen", widget: "image"}
          - {label: "Frase 'Nuestra diferencia'", name: "diferencia_frase", widget: "string"}
          - {label: "Valores (separados por ·)", name: "diferencia_valores", widget: "string"}
          - {label: "Enlace de Instagram", name: "instagram_url", widget: "string"}
          - {label: "Enlace de Facebook", name: "facebook_url", widget: "string"}

  - name: "galeria"
    label: "Galería de experiencia"
    files:
      - file: "content/galeria.json"
        label: "Fotos de la galería"
        name: "galeria"
        fields:
          - label: "Fotos"
            name: "fotos"
            widget: "list"
            fields:
              - {label: "Foto", name: "imagen", widget: "image"}
              - {label: "Descripción", name: "descripcion", widget: "string"}

  - name: "sedes"
    label: "Sedes"
    files:
      - file: "content/sedes.json"
        label: "Lista de sedes"
        name: "sedes"
        fields:
          - label: "Sedes"
            name: "sedes"
            widget: "list"
            fields:
              - {label: "Nombre de la sede", name: "nombre", widget: "string"}
              - {label: "Dirección", name: "direccion", widget: "string"}
              - {label: "Número de WhatsApp (con código de país, solo números)", name: "whatsapp_numero", widget: "string"}
              - {label: "Enlace de Google Maps", name: "maps_url", widget: "string"}
              - {label: "Foto", name: "foto", widget: "image"}

  - name: "programas"
    label: "Programas"
    files:
      - file: "content/programas.json"
        label: "Lista de programas"
        name: "programas"
        fields:
          - label: "Programas"
            name: "programas"
            widget: "list"
            fields:
              - {label: "Nombre del programa", name: "nombre", widget: "string"}
              - {label: "Etiqueta", name: "etiqueta", widget: "string"}
              - {label: "Descripción corta (tarjeta)", name: "descripcion_corta", widget: "string"}
              - {label: "Descripción larga (al expandir)", name: "descripcion_larga", widget: "text"}
              - {label: "Foto", name: "foto", widget: "image"}
